name: Render Buyer OG PNG (temporary)
on:
  push:
    branches:
      - ux/opus-audit-last-mile-20261014
    paths:
      - img/social-card-buyer.svg
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render 1200x630 PNG from SVG with Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk
          rsvg-convert -w 1200 -h 630 img/social-card-buyer.svg -o img/social-card-buyer.png
          file img/social-card-buyer.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('img/social-card-buyer.png')
          b=p.read_bytes()
          assert b.startswith(b'\x89PNG\r\n\x1a\n')
          assert struct.unpack('>II',b[16:24]) == (1200,630)
          assert len(b)>10000
          PY
      - name: Commit rendered PNG into PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/social-card-buyer.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: render Korean buyer-first social preview"
            git push origin HEAD:ux/opus-audit-last-mile-20261014
          fi
