  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="12" height="630" fill="#168dff"/>
  <path d="M 770 695 C 680 300 890 38 1290 -48" stroke="#1476d6" stroke-opacity=".2" stroke-width="26" fill="none"/>
