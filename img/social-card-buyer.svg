  <text x="80" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#f7fbff">ProblemSolver<tspan fill="#37a8ff">Arc</tspan></text>
  <text x="82" y="168" font-family="Noto Sans CJK KR,Noto Sans KR,DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#a7caed">반복 업무 자동화 · 사내 프로그램</text>
  <text x="78" y="285" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="62" font-weight="800" fill="#ffffff">반복 업무를 줄이는</text>
