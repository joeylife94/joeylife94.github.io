      <stop offset="0" stop-color="#23262e"/>
      <stop offset=".68" stop-color="#14171d"/>
      <stop offset="1" stop-color="#192131"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#095dbb" stop-opacity=".1"/>
      <stop offset=".45" stop-color="#168fff" stop-opacity=".75"/>
      <stop offset=".80" stop-color="#72c7ff"/>
      <stop offset="1" stop-color="#116cdb" stop-opacity=".4"/>
