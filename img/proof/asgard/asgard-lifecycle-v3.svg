<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Asgard local-first AI operations lifecycle</title>
<desc id="desc">A bounded proof architecture showing an asynchronous AI job lifecycle and controlled recovery path.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64ffda"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8892b0"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020c1b" flood-opacity="0.35"/>
  </filter>
  <style>
    .bg { fill:#0a192f; }
    .panel { fill:#112240; stroke:#233554; stroke-width:2; }
    .node { fill:#112240; stroke:#233554; stroke-width:2; rx:20; }
    .node-accent { fill:#0f2b3f; stroke:#64ffda; stroke-width:2.5; rx:20; }
    .node-fail { fill:#251f2d; stroke:#ff7b8b; stroke-width:2; rx:20; }
    .node-recover { fill:#162a2d; stroke:#64ffda; stroke-width:2; rx:20; }
    .title { font:700 52px Inter,Arial,sans-serif; fill:#e6f1ff; }
    .subtitle { font:500 24px Inter,Arial,sans-serif; fill:#a8b2d1; }
    .kicker { font:700 17px Inter,Arial,sans-serif; letter-spacing:2.8px; fill:#64ffda; }
    .node-title { font:700 21px Inter,Arial,sans-serif; fill:#e6f1ff; }
    .node-sub { font:500 15px Inter,Arial,sans-serif; fill:#8892b0; }
    .section { font:700 18px Inter,Arial,sans-serif; letter-spacing:2px; fill:#ccd6f6; }
    .small { font:500 14px Inter,Arial,sans-serif; fill:#8892b0; }
    .chip { fill:#0f2b3f; stroke:#233554; stroke-width:1.5; rx:18; }
    .chiptext { font:600 14px Inter,Arial,sans-serif; fill:#a8b2d1; }
    .arrow { stroke:#64ffda; stroke-width:3; fill:none; marker-end:url(#arrow); }
    .arrow-muted { stroke:#8892b0; stroke-width:2.5; fill:none; marker-end:url(#arrowMuted); }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<g filter="url(#shadow)">
  <rect x="70" y="58" width="1460" height="784" rx="32" class="panel"/>
</g>

<text x="120" y="120" class="kicker">ASGARD · FLAGSHIP PROOF</text>
<text x="120" y="182" class="title">Local-first AI job lifecycle</text>
<text x="120" y="222" class="subtitle">Persistent state, asynchronous execution, controlled recovery, and visible operating evidence.</text>

<text x="120" y="294" class="section">ACCEPTED JOB PATH</text>

<g transform="translate(120,330)">
  <rect width="160" height="104" class="node"/>
  <text x="80" y="46" text-anchor="middle" class="node-title">Input / Log</text>
  <text x="80" y="73" text-anchor="middle" class="node-sub">request boundary</text>
</g>
<path d="M280 382 H320" class="arrow"/>

<g transform="translate(320,330)">
  <rect width="170" height="104" class="node-accent"/>
  <text x="85" y="44" text-anchor="middle" class="node-title">Heimdall</text>
  <text x="85" y="72" text-anchor="middle" class="node-sub">Java · Spring</text>
</g>
<path d="M490 382 H530" class="arrow"/>

<g transform="translate(530,330)">
  <rect width="220" height="104" class="node-accent"/>
  <text x="110" y="40" text-anchor="middle" class="node-title">Persistent Job</text>
  <text x="110" y="68" text-anchor="middle" class="node-sub">PostgreSQL state</text>
</g>
<path d="M750 382 H790" class="arrow"/>

<g transform="translate(790,330)">
  <rect width="150" height="104" class="node"/>
  <text x="75" y="45" text-anchor="middle" class="node-title">Kafka</text>
  <text x="75" y="73" text-anchor="middle" class="node-sub">async handoff</text>
</g>
<path d="M940 382 H980" class="arrow"/>

<g transform="translate(980,330)">
  <rect width="170" height="104" class="node"/>
  <text x="85" y="45" text-anchor="middle" class="node-title">Bifrost</text>
  <text x="85" y="73" text-anchor="middle" class="node-sub">Python execution</text>
</g>
<path d="M1150 382 H1190" class="arrow"/>

<g transform="translate(1190,330)">
  <rect width="210" height="104" class="node-accent"/>
  <text x="105" y="40" text-anchor="middle" class="node-title">Local AI</text>
  <text x="105" y="68" text-anchor="middle" class="node-sub">Ollama · real run</text>
</g>

<path d="M1295 434 V486 H1040" class="arrow"/>
<g transform="translate(830,470)">
  <rect width="210" height="104" class="node"/>
  <text x="105" y="40" text-anchor="middle" class="node-title">Result Event</text>
  <text x="105" y="68" text-anchor="middle" class="node-sub">Kafka return path</text>
</g>
<path d="M830 522 H790" class="arrow"/>
<g transform="translate(580,470)">
  <rect width="210" height="104" class="node-accent"/>
  <text x="105" y="40" text-anchor="middle" class="node-title">Persistence</text>
  <text x="105" y="68" text-anchor="middle" class="node-sub">result + final state</text>
</g>
<path d="M580 522 H540" class="arrow"/>
<g transform="translate(320,470)">
  <rect width="220" height="104" class="node"/>
  <text x="110" y="40" text-anchor="middle" class="node-title">Operator / Metrics</text>
  <text x="110" y="68" text-anchor="middle" class="node-sub">audit · Prometheus/Grafana</text>
</g>

<text x="120" y="660" class="section">CONTROLLED RECOVERY PATH</text>
<g transform="translate(120,696)">
  <rect width="190" height="88" class="node-fail"/>
  <text x="95" y="37" text-anchor="middle" class="node-title">FAILED / DLQ</text>
  <text x="95" y="63" text-anchor="middle" class="node-sub">persisted failure</text>
</g>
<path d="M310 740 H350" class="arrow-muted"/>

<g transform="translate(350,696)">
  <rect width="220" height="88" class="node-recover"/>
  <text x="110" y="37" text-anchor="middle" class="node-title">Authorized Redrive</text>
  <text x="110" y="63" text-anchor="middle" class="node-sub">explicit operator action</text>
</g>
<path d="M570 740 H610" class="arrow-muted"/>

<g transform="translate(610,696)">
  <rect width="160" height="88" class="node"/>
  <text x="80" y="37" text-anchor="middle" class="node-title">Audit</text>
  <text x="80" y="63" text-anchor="middle" class="node-sub">reason + actor</text>
</g>
<path d="M770 740 H810" class="arrow-muted"/>

<g transform="translate(810,696)">
  <rect width="160" height="88" class="node"/>
  <text x="80" y="37" text-anchor="middle" class="node-title">Retry</text>
  <text x="80" y="63" text-anchor="middle" class="node-sub">attempt 0 → 1</text>
</g>
<path d="M970 740 H1010" class="arrow-muted"/>

<g transform="translate(1010,696)">
  <rect width="190" height="88" class="node-recover"/>
  <text x="95" y="37" text-anchor="middle" class="node-title">SUCCEEDED</text>
  <text x="95" y="63" text-anchor="middle" class="node-sub">persisted final state</text>
</g>

<g transform="translate(1240,678)">
  <rect width="220" height="42" class="chip"/>
  <text x="110" y="26" text-anchor="middle" class="chiptext">Real local model proof</text>
</g>
<g transform="translate(1240,730)">
  <rect width="220" height="42" class="chip"/>
  <text x="110" y="26" text-anchor="middle" class="chiptext">Bounded recovery proof</text>
</g>
<g transform="translate(1240,782)">
  <rect width="220" height="42" class="chip"/>
  <text x="110" y="26" text-anchor="middle" class="chiptext">Not production-readiness</text>
</g>

<text x="120" y="818" class="small">Evidence boundary: accepted single-node proof with real local inference, recovery/audit, and bounded observability.</text>
</svg>